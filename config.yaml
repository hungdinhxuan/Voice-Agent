audio:
  sample_rate: 16000
  channels: 1
  block_size: 512
  input_device: null
  output_device: null
  output_sample_rate: 48000
  allow_barge_in: true
  interrupt_phrases:
    - dừng
    - dừng lại
    - ngừng
    - ngừng lại
    - thôi
  echo_guard_ms: 600

vad:
  threshold: 0.5
  min_speech_ms: 250
  min_silence_ms: 400
  speech_pad_ms: 150

asr:
  backend: parakeet
  model: nvidia/parakeet-ctc-0.6b-Vietnamese
  checkpoint_file: parakeet-ctc-0.6b-vi.nemo
  device: cuda
  dtype: bfloat16
  language: vi
  max_new_tokens: 256

llm:
  backend: ollama
  model: qwen3.5:4b
  host: http://127.0.0.1:11434
  keep_alive: -1
  context_length: 4096
  hf_model: Qwen/Qwen3.5-4B
  device: cuda
  dtype: bfloat16
  temperature: 0.7
  top_p: 0.8
  top_k: 20
  max_tokens: 256
  do_sample: true
  enable_thinking: false

web:
  host: 127.0.0.1
  port: 8080
  access_token: null
  tls_certfile: null
  tls_keyfile: null
  allowed_origins: []
  require_same_origin: false
  playback_prebuffer_ms: 120
  default_language: vi
  max_sessions: 4

tts:
  provider: vieneu
  model: VieNeu-TTS v3 Turbo
  backend: onnx
  device: cpu
  precision: int8
  voice: null
  sample_rate: 48000
  lang_code: null

tts_chunker:
  min_chars: 15
  preferred_chars: 60
  max_chars: 120

conversation:
  max_history_turns: 20
  system_prompt: |-
    Bạn là trợ lý giọng nói gắn trên một con robot.
    Trả lời bằng tiếng Việt, TỐI ĐA MỘT CÂU NGẮN. Không bao giờ dài hơn hai câu.
    Sau khi điều khiển thiết bị, chỉ xác nhận thật gọn, ví dụ "Đã tiến hai mươi phân."
    Không giải thích, không liệt kê, không nhắc lại câu người dùng vừa nói, không Markdown.
    Người dùng đang nghe chứ không đọc, nên mỗi từ thừa là một quãng chờ.

runtime:
  max_concurrent_asr: 1
  max_concurrent_llm: 1
  max_concurrent_tts: 1

english:
  asr:
    backend: parakeet
    model: nvidia/parakeet-tdt-0.6b-v3
    checkpoint_file: null
    device: cuda
    dtype: bfloat16
    language: en
    max_new_tokens: 256
  tts:
    provider: kokoro
    model: hexgrad/Kokoro-82M
    backend: pytorch
    device: cuda
    precision: float32
    voice: af_heart
    sample_rate: 24000
    lang_code: a
  conversation:
    max_history_turns: 20
    system_prompt: |-
      You are a voice assistant riding on a robot.
      Reply in English, ONE SHORT SENTENCE. Never more than two.
      After a device action, confirm briefly, e.g. "Moved forward twenty centimetres."
      No explaining, no lists, no repeating what the user said, no Markdown.
      They are listening, not reading, so every spare word is a wait.
  interrupt_phrases:
    - stop
    - stop talking
    - please stop
    - be quiet

xiaozhi:
  enabled: false
  path: /xiaozhi/v1/
  access_token: null
  language: vi
  max_sessions: 4
  protocol_version: 1
  downlink_sample_rate: 24000
  frame_duration_ms: 60
  opus_bitrate: 24000
  prebuffer_frames: 5
  max_queued_frames: 100
  mcp_enabled: true
  mcp_timeout_seconds: 10.0
  max_tool_rounds: 3
  log_transcripts: false
