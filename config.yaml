audio:
  sample_rate: 16000
  channels: 1
  block_size: 512
  input_device: null
  output_device: null
  output_sample_rate: 48000
  allow_barge_in: true
  interrupt_phrases:
    - dừng
    - dừng lại
    - ngừng
    - ngừng lại
    - thôi
  echo_guard_ms: 600

vad:
  threshold: 0.5
  min_speech_ms: 250
  min_silence_ms: 400
  speech_pad_ms: 150

asr:
  backend: parakeet
  model: nvidia/parakeet-ctc-0.6b-Vietnamese
  checkpoint_file: parakeet-ctc-0.6b-vi.nemo
  device: cuda
  dtype: bfloat16
  language: vi
  max_new_tokens: 256

llm:
  backend: ollama
  model: qwen3.5:4b
  host: http://127.0.0.1:11434
  keep_alive: -1
  context_length: 4096
  hf_model: Qwen/Qwen3.5-4B
  device: cuda
  dtype: bfloat16
  temperature: 0.7
  top_p: 0.8
  top_k: 20
  max_tokens: 256
  do_sample: true
  enable_thinking: false

web:
  host: 127.0.0.1
  port: 8080
  access_token: null
  tls_certfile: null
  tls_keyfile: null
  allowed_origins: []
  require_same_origin: false
  playback_prebuffer_ms: 120
  default_language: vi
  max_sessions: 4

tts:
  provider: vieneu
  model: VieNeu-TTS v3 Turbo
  backend: onnx
  device: cpu
  precision: int8
  voice: null
  sample_rate: 48000
  lang_code: null

tts_chunker:
  min_chars: 15
  preferred_chars: 60
  max_chars: 120

conversation:
  max_history_turns: 20
  system_prompt: |-
    Bạn là trợ lý hội thoại cho một robot.
    Hãy trả lời bằng tiếng Việt tự nhiên, ngắn gọn và phù hợp với hội thoại bằng giọng nói.
    Không sử dụng Markdown trừ khi thật sự cần thiết.
    Không trả lời quá dài nếu người dùng không yêu cầu.
    Ưu tiên câu văn dễ chuyển thành tiếng nói.

runtime:
  max_concurrent_asr: 1
  max_concurrent_llm: 1
  max_concurrent_tts: 1

english:
  asr:
    backend: parakeet
    model: nvidia/parakeet-tdt-0.6b-v3
    checkpoint_file: null
    device: cuda
    dtype: bfloat16
    language: en
    max_new_tokens: 256
  tts:
    provider: kokoro
    model: hexgrad/Kokoro-82M
    backend: pytorch
    device: cuda
    precision: float32
    voice: af_heart
    sample_rate: 24000
    lang_code: a
  conversation:
    max_history_turns: 20
    system_prompt: |-
      You are a concise conversational voice assistant.
      Reply naturally in English.
      Avoid Markdown unless it is necessary.
      Prefer text that is easy to speak aloud.
  interrupt_phrases:
    - stop
    - stop talking
    - please stop
    - be quiet
