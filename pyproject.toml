[project]
name = "local-vietnamese-voice-agent"
version = "0.1.0"
description = "Fully local real-time Vietnamese and English voice conversation agent"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "accelerate>=1.10,<2",
    "braceexpand>=0.1.7,<0.2",
    "datasets>=5,<6",
    "editdistance>=0.8,<1",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    "einops>=0.8,<1",
    "fastapi>=0.141,<0.142",
    "fiddle>=0.3,<0.4",
    "hydra-core==1.3.2",
    "httpx>=0.28,<0.29",
    "ipython>=9.17,<10",
    "jiwer>=3.1,<4",
    "kaldialign>=0.12,<0.13",
    "kokoro>=0.9.4,<0.10",
    "lhotse>=1.31,<2",
    "lightning==2.4.0",
    "nemo-toolkit==2.6.0",
    "numpy>=2.0,<3",
    "nv-one-logger-core>=2.3.1,<3",
    "nv-one-logger-pytorch-lightning-integration>=2.3.1,<3",
    "nv-one-logger-training-telemetry>=2.3.1,<3",
    "onnx>=1.22,<1.23",
    "pyannote-core>=5,<6",
    "pyannote-metrics>=3.2,<4",
    "pyyaml>=6.0.2,<7",
    "sentencepiece>=0.2,<0.3",
    "silero-vad[onnx-cpu]>=6.2.1,<6.3",
    "sounddevice>=0.5.3,<0.6",
    "soundfile>=0.13,<0.14",
    "soxr>=0.5,<1",
    "torch==2.8.0",
    "torchaudio==2.8.0",
    "torchvision==0.23.0",
    "transformers>=5.13.0,<5.14",
    "text-unidecode>=1.3,<2",
    "uvicorn[standard]>=0.41,<0.42",
    "vieneu>=3.2.3,<3.3",
    "webdataset>=1,<2",
    "wget>=3.2,<4",
    "wrapt>=2.4,<3",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
    "pytest-asyncio>=1.1,<2",
]

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]
torchaudio = [
    { index = "pytorch", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]
torchvision = [
    { index = "pytorch", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
